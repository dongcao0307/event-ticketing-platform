spring.application.name=booking-service

# ═════════════════════════════════════════════════════════
# Server Configuration
# ═════════════════════════════════════════════════════════
server.port=8083
server.servlet.context-path=/
management.server.port=8083

# ═════════════════════════════════════════════════════════
# gRPC Client Configuration
# ═════════════════════════════════════════════════════════
grpc.client.event-service.host=${EVENT_SERVICE_GRPC_HOST:localhost}
grpc.client.event-service.port=${EVENT_SERVICE_GRPC_PORT:50051}

# ═════════════════════════════════════════════════════════
# Database Configuration (MySQL)
# ═════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ═════════════════════════════════════════════════════════
# JPA Configuration
# ═════════════════════════════════════════════════════════
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ═════════════════════════════════════════════════════════
# Redis Configuration
# ═════════════════════════════════════════════════════════
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# ═════════════════════════════════════════════════════════
# RabbitMQ Configuration
# ═════════════════════════════════════════════════════════
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Consume payment status changed events from payment-service
payment.messaging.enabled=true
payment.messaging.exchange=payment.exchange
payment.messaging.routing-key=payment.status.changed
payment.messaging.queue=payment.status.changed.queue

# Publish booking paid events for downstream services (ticket-service)
booking.messaging.enabled=true
booking.messaging.exchange=booking.exchange
booking.messaging.routing-key=booking.paid
booking.messaging.queue=booking.paid.ticket.queue

# Publish booking notification details for notification-service
booking.notification.messaging.enabled=true
booking.notification.messaging.exchange=booking.notification.exchange
booking.notification.messaging.routing-key=booking.notification.created

# Business config
booking.expire.minutes=15

# ═════════════════════════════════════════════════════════
# Logging
# ═════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.fit.iuh=DEBUG
