server:
  port: 8091

spring:
  application:
    name: ai-service
  ai:
    openai:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      api-key: ollama
      chat:
        options:
          model: ${OLLAMA_MODEL:ticketbox-ai}
      embedding:
        enabled: false

openai:
  embedding:
    model: text-embedding-3-small

# Internal service URLs (Docker network hostnames)
services:
  event:
    base-url: ${EVENT_SERVICE_BASE_URL:http://event-service:8082}
