syntax = "proto3";

package fit.iuh.booking_service.grpc;

option java_multiple_files = true;
option java_package = "fit.iuh.booking_service.grpc.generated";

service BookingGrpcService {
    rpc GetBookingById(GetBookingByIdRequest) returns (GetBookingByIdResponse);
}

message GetBookingByIdRequest {
    int64 booking_id = 1;
}

message GetBookingByIdResponse {
    BookingDto booking = 1;
}

message BookingDto {
    int64 id = 1;
    int64 user_id = 2;
    string idempotence_key = 3;
    double subtotal = 4;
    double discount_amount = 5;
    double total_amount = 6;
    string status = 7;
    string created_at = 8;
    repeated BookingItemDto items = 9;
}

message BookingItemDto {
    int64 id = 1;
    int64 ticket_type_id = 2;
    int32 quantity = 3;
    double unit_price = 4;
}