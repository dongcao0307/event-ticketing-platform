spring.application.name=ticket-service

# ═════════════════════════════════════════════════════════
# Server Configuration
# ═════════════════════════════════════════════════════════
server.port=8084
server.servlet.context-path=/
management.server.port=8084

# ═════════════════════════════════════════════════════════
# Database Configuration (MySQL)
# ═════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ═════════════════════════════════════════════════════════
# RabbitMQ Configuration
# ═════════════════════════════════════════════════════════
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

booking.messaging.enabled=true
booking.messaging.exchange=booking.exchange
booking.messaging.routing-key=booking.paid
booking.messaging.queue=booking.paid.ticket.queue

# Consume booking lifecycle events
booking.lifecycle.messaging.enabled=true
booking.lifecycle.messaging.exchange=booking.lifecycle.exchange
booking.lifecycle.messaging.created-routing-key=booking.created
booking.lifecycle.messaging.cancelled-routing-key=booking.cancelled
booking.lifecycle.messaging.created-queue=booking.created.ticket.queue
booking.lifecycle.messaging.cancelled-queue=booking.cancelled.ticket.queue

# Publish ticket reservation events
ticket.reservation.messaging.enabled=true
ticket.reservation.messaging.exchange=ticket.reservation.exchange
ticket.reservation.messaging.reserved-routing-key=ticket.reserved
ticket.reservation.messaging.failed-routing-key=ticket.reservation.failed
ticket.reservation.messaging.reserved-queue=ticket.reserved.booking.queue
ticket.reservation.messaging.failed-queue=ticket.reservation.failed.booking.queue

# ═════════════════════════════════════════════════════════
# JPA Configuration
# ═════════════════════════════════════════════════════════
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ═════════════════════════════════════════════════════════
# Logging
# ═════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.fit.iuh=DEBUG
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Outbox
outbox.enabled=true
outbox.poll-interval-ms=2000

# ═════════════════════════════════════════════════════════
# JWT Configuration
# ═════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

