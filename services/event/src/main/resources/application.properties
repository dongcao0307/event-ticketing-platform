# ==============================================================
# THONG TIN CHUNG
# ==============================================================
spring.application.name=event-service
server.port=8082
server.servlet.context-path=/
management.server.port=8082

# ==============================================================
# gRPC SERVER CONFIGURATION
# ==============================================================
grpc.server.port=${GRPC_SERVER_PORT:50051}

# ==============================================================
# CAU HINH DATABASE (MySQL)
# ==============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/ticketbox?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# REDIS (Caching)
# ==============================================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=60000ms
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# CAU HINH CACHE
# Cache type: redis (Spring Cache with Redis backend)
spring.cache.type=redis
# Default cache TTL: 1 hour (3600000 ms) - Configured in RedisConfig.java
spring.cache.redis.time-to-live=3600000
# Enable cache statistics for monitoring
spring.cache.redis.enable-statistics=true

# ============================================================== 
# RABBITMQ
# ============================================================== 
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Booking paid events (consume)
booking.messaging.enabled=true
booking.messaging.exchange=booking.exchange
booking.messaging.routing-key=booking.paid
booking.messaging.queue=booking.paid.event.queue

# Booking cancelled/expired events (consume)
booking.lifecycle.messaging.enabled=true
booking.lifecycle.messaging.exchange=booking.lifecycle.exchange
booking.lifecycle.messaging.created-routing-key=booking.created
booking.lifecycle.messaging.cancelled-routing-key=booking.cancelled
booking.lifecycle.messaging.created-queue=booking.created.event.queue
booking.lifecycle.messaging.cancelled-queue=booking.cancelled.event.queue

# Ticket reservation events (consume)
ticket.reservation.messaging.enabled=true
ticket.reservation.messaging.exchange=ticket.reservation.exchange
ticket.reservation.messaging.reserved-routing-key=ticket.reserved
ticket.reservation.messaging.failed-routing-key=ticket.reservation.failed
ticket.reservation.messaging.reserved-queue=ticket.reserved.event.queue
ticket.reservation.messaging.failed-queue=ticket.reservation.failed.event.queue

# Reservation TTL (minutes)
event.reservation.ttl.minutes=15

# ==============================================================
# AWS S3 & MULTIPART
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

aws.s3.bucket=${AWS_S3_BUCKET_NAME}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}

# ==============================================================
# SECURITY & LOGGING
# ==============================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration=3600000

logging.level.root=INFO
logging.level.fit.iuh=DEBUG

# ==============================================================
# FLYWAY
# ==============================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration