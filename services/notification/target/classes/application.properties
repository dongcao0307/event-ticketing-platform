spring.application.name=notification-service
spring.config.import=optional:classpath:notification-secrets.properties

# ═════════════════════════════════════════════════════════
# Server Configuration
# ═════════════════════════════════════════════════════════
server.port=8090
server.servlet.context-path=/
management.server.port=8090

# ═════════════════════════════════════════════════════════
# RabbitMQ Configuration (Message Queue)
# ═════════════════════════════════════════════════════════
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

# Payment -> notification
notification.payment.messaging.enabled=true
notification.payment.messaging.exchange=payment.notification.exchange
notification.payment.messaging.routing-key=payment.notification.created
notification.payment.messaging.queue=payment.notification.queue

# Booking -> notification
notification.booking.messaging.enabled=true
notification.booking.messaging.exchange=booking.notification.exchange
notification.booking.messaging.routing-key=booking.notification.created
notification.booking.messaging.queue=booking.notification.queue

# Redis cache for payment/booking merge
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# MongoDB
spring.mongodb.database=${MONGODB_DATABASE:ticketbox}

spring.mongodb.host=${MONGODB_HOST:mongodb}
spring.mongodb.port=${MONGODB_PORT:27017}

spring.mongodb.username=${MONGODB_USERNAME:admin}
spring.mongodb.password=${MONGODB_PASSWORD:admin}
spring.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:admin}

# gRPC identity client
grpc.client.identity-service.host=${IDENTITY_SERVICE_GRPC_HOST:localhost}
grpc.client.identity-service.port=${IDENTITY_SERVICE_GRPC_PORT:50052}

# Booking REST client (payment-only fallback)
booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}

# Mail defaults (credentials in notification-secrets.properties)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ═════════════════════════════════════════════════════════
# Logging
# ═════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.fit.iuh=DEBUG
