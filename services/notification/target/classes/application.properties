spring.application.name=notification-service
spring.config.import=optional:classpath:notification-secrets.properties

# ═════════════════════════════════════════════════════════
# Server Configuration
# ═════════════════════════════════════════════════════════
server.port=8090
server.servlet.context-path=/
management.server.port=8090

# ═════════════════════════════════════════════════════════
# RabbitMQ Configuration (Message Queue)
# ═════════════════════════════════════════════════════════
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

# Payment -> notification
notification.payment.messaging.enabled=true
notification.payment.messaging.exchange=payment.notification.exchange
notification.payment.messaging.routing-key=payment.notification.created
notification.payment.messaging.queue=payment.notification.queue
notification.payment.messaging.dlq-exchange=payment.notification.dlq.exchange
notification.payment.messaging.dlq-routing-key=payment.notification.dlq
notification.payment.messaging.dlq-queue=payment.notification.dlq.queue

# Booking -> notification
notification.booking.messaging.enabled=true
notification.booking.messaging.exchange=booking.notification.exchange
notification.booking.messaging.routing-key=booking.notification.created
notification.booking.messaging.queue=booking.notification.queue
notification.booking.messaging.dlq-exchange=booking.notification.dlq.exchange
notification.booking.messaging.dlq-routing-key=booking.notification.dlq
notification.booking.messaging.dlq-queue=booking.notification.dlq.queue

# Notification orchestrator TTLs
notification.orchestrator.merge-ttl=30s
notification.orchestrator.sent-ttl=24h
notification.orchestrator.schedule-ttl=40s

# Notification listener retry
notification.listener.retry.max-attempts=3
notification.listener.retry.initial-interval=500ms
notification.listener.retry.multiplier=2
notification.listener.retry.max-interval=5s

# Redis cache for payment/booking merge
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# MongoDB
spring.mongodb.database=${MONGODB_DATABASE:ticketbox}

spring.mongodb.host=${MONGODB_HOST:mongodb}
spring.mongodb.port=${MONGODB_PORT:27017}

spring.mongodb.username=${MONGODB_USERNAME:admin}
spring.mongodb.password=${MONGODB_PASSWORD:admin}
spring.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:admin}

# gRPC identity client
grpc.client.identity-service.host=${IDENTITY_SERVICE_GRPC_HOST:localhost}
grpc.client.identity-service.port=${IDENTITY_SERVICE_GRPC_PORT:50052}
grpc.client.identity-service.deadline-ms=${IDENTITY_SERVICE_GRPC_DEADLINE_MS:2000}

# Booking REST client (payment-only fallback)
booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}

# Mail defaults (credentials in notification-secrets.properties)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ═════════════════════════════════════════════════════════
# Resilience4j Circuit Breaker
# ═════════════════════════════════════════════════════════
resilience4j.circuitbreaker.instances.bookingRestClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bookingRestClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.bookingRestClient.slidingWindowSize=20
resilience4j.circuitbreaker.instances.bookingRestClient.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.bookingRestClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookingRestClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bookingRestClient.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.bookingRestClient.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.bookingRestClient.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.bookingRestClient.slowCallDurationThreshold=2s

resilience4j.circuitbreaker.instances.identityGrpc.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.identityGrpc.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.identityGrpc.slidingWindowSize=20
resilience4j.circuitbreaker.instances.identityGrpc.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.identityGrpc.failureRateThreshold=50
resilience4j.circuitbreaker.instances.identityGrpc.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.identityGrpc.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.identityGrpc.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.identityGrpc.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.identityGrpc.slowCallDurationThreshold=2s

resilience4j.circuitbreaker.instances.notificationConsumer.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationConsumer.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.notificationConsumer.slidingWindowSize=20
resilience4j.circuitbreaker.instances.notificationConsumer.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.notificationConsumer.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationConsumer.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationConsumer.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.notificationConsumer.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.notificationConsumer.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.notificationConsumer.slowCallDurationThreshold=2s

# ═════════════════════════════════════════════════════════
# Logging
# ═════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.fit.iuh=DEBUG
