<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Payment Notification</title>
</head>
<body>
<h2>Payment Confirmation</h2>

</body>
</html>
