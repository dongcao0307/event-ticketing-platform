version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: ticketbox-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketbox
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./script/ticketbox-db.sql:/docker-entrypoint-initdb.d/ticketbox-db.sql
    networks:
      - ticketbox-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ticketbox-redis
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketbox-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ticketbox-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: ticketbox
    #    ports:
    #      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - ticketbox-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ticketbox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticketbox-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ═══════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ticketbox-gateway
    depends_on:
      - identity-service
      - event-service
      - booking-service
      - payment-service
      - ticket-service
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./gateway/certs:/etc/nginx/certs:ro
    networks:
      - ticketbox-net
    restart: on-failure

  # ═══════════════════════════════════════════════════════════
  # SERVICES
  # ═══════════════════════════════════════════════════════════
  identity-service:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: ticketbox-identity
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_ACCESS_TOKEN_EXPIRATION: 900000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000
    restart: on-failure

  event-service:
    build:
      context: ./services/event
      dockerfile: Dockerfile
    container_name: ticketbox-event
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "50051:50051" # gRPC server port
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      GRPC_SERVER_PORT: 50051

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}

  booking-service:
    build:
      context: ./services/booking
      dockerfile: Dockerfile
    container_name: ticketbox-booking
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      event-service:
        condition: service_started
    ports:
      - "8083:8083"
      - "50053:50053"       # gRPC server port
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      EVENT_SERVICE_GRPC_HOST: event-service
      EVENT_SERVICE_GRPC_PORT: 50051
      EVENT_SERVICE_GRPC_DEADLINE_MS: 2000
      GRPC_SERVER_PORT: 50053

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: ticketbox-payment
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking-service:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      BOOKING_SERVICE_GRPC_HOST: booking-service
      BOOKING_SERVICE_GRPC_PORT: 50053
      EVENT_SERVICE_GRPC_HOST: event-service
      EVENT_SERVICE_GRPC_PORT: 50051
      PAYMENT_VNPAY_RETURN_URL: https://youtube.com
      PAYMENT_VNPAY_TIMEZONE: Asia/Ho_Chi_Minh
      PAYMENT_MOMO_RETURN_URL: https://youtube.com
      PAYMENT_MOMO_IPN_URL: ${PAYMENT_MOMO_IPN_HOST}api/payment/momo/ipn

  ticket-service:
    build:
      context: ./services/ticket
      dockerfile: Dockerfile
    container_name: ticketbox-ticket
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: redis
      REDIS_PORT: 6379

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: ticketbox-notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      identity-service:
        condition: service_started
      booking-service:
        condition: service_started
    ports:
      - "8090:8090"
    networks:
      - ticketbox-net
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: admin
      MONGODB_DATABASE: ticketbox
      MONGODB_AUTHENTICATION_DATABASE: admin
      IDENTITY_SERVICE_GRPC_HOST: identity-service
      IDENTITY_SERVICE_GRPC_PORT: 50052
      IDENTITY_SERVICE_GRPC_DEADLINE_MS: 2000
      BOOKING_SERVICE_BASE_URL: http://booking-service:8083
      NOTIFICATION_PAYMENT_MESSAGING_DLQ_EXCHANGE: payment.notification.dlq.exchange
      NOTIFICATION_PAYMENT_MESSAGING_DLQ_ROUTING_KEY: payment.notification.dlq
      NOTIFICATION_PAYMENT_MESSAGING_DLQ_QUEUE: payment.notification.dlq.queue
      NOTIFICATION_BOOKING_MESSAGING_DLQ_EXCHANGE: booking.notification.dlq.exchange
      NOTIFICATION_BOOKING_MESSAGING_DLQ_ROUTING_KEY: booking.notification.dlq
      NOTIFICATION_BOOKING_MESSAGING_DLQ_QUEUE: booking.notification.dlq.queue

  statistical-service:
    build:
      context: ./services/statistical
      dockerfile: Dockerfile
    container_name: ticketbox-statistical
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8089:8089"
    networks:
      - ticketbox-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbox?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: ticketbox-ai
    ports:
      - "8091:8091"
    networks:
      - ticketbox-net
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      EVENT_SERVICE_BASE_URL: http://event-service:8082

  # ═══════════════════════════════════════════════════════════
  # WEB APPLICATION (React + Vite)
  # ═══════════════════════════════════════════════════════════
  web-app:
    build:
      context: ./web/web-app
      dockerfile: Dockerfile
    container_name: ticketbox-web
    depends_on:
      - gateway
    ports:
      - "3001:3000"
    networks:
      - ticketbox-net
    restart: on-failure

volumes:
  mysql_data:
  redis_data:
  mongodb_data:
  mongodb_config:
  rabbitmq_data:

networks:
  ticketbox-net:
    driver: bridge
