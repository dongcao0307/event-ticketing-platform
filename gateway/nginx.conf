# ═════════════════════════════════════════════════════════
# TicketBox - API Gateway (Nginx Configuration)
# ═════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/s;limit_req_status 429;
client_max_body_size 50M;

upstream identity_backend { server identity-service:8087; keepalive 32; }
upstream event_backend { server event-service:8082; keepalive 32; }
upstream booking_backend { server booking-service:8083; keepalive 32; }
upstream ticket_backend { server ticket-service:8084; keepalive 32; }
upstream payment_backend { server payment-service:8085; keepalive 32; }
upstream statistical_backend { server statistical-service:8089; keepalive 32; }
upstream ai_backend { server ai-service:8091; keepalive 16; }
upstream web_backend { server web-app:3000; keepalive 32; }

server {
    listen 80 default_server;
    server_name _;
    
    # Chỉ redirect nếu không phải là request nội bộ (dựa vào header)
    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host:8443$request_uri;
        }
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 'TicketBox API Gateway OK\n';
    }

    # ─── 1. Identity Service (/api/auth & /api/admin/users) ───
    location /api/auth {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req zone=login_limit burst=10 nodelay;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass http://identity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # ÉP GIAO THỨC HTTPS ĐỂ TRÁNH REDIRECT LỖI
        
        proxy_redirect off; # TẮT BẺ LÁI TỰ ĐỘNG

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    location /api/admin/users {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://identity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 2. Event Service (/api/events & /api/organizer & /api/admin/events) ───
    location /api/events {
        limit_req zone=api_limit burst=30 nodelay;
        
        # Cắt chính xác chữ /api/ đi để Backend Event nhận đúng đường dẫn
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://event_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    location /api/organizer {
        limit_req zone=api_limit burst=30 nodelay;
        
        # Cắt chính xác chữ /api/ đi để Backend Event nhận đúng đường dẫn upload
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://event_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }
    
    location /api/admin/events {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://event_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 3. Booking Service (/api/bookings) ────────────
    location /api/bookings {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://booking_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 4. Ticket Service (/api/tickets & /api/ticket_types) ────────
    location /api/tickets {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://ticket_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    location /api/ticket_types {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://ticket_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 5. Payment Service (/api/payment) ────────────
    location /api/payment {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req zone=payment_limit burst=5 nodelay;
        proxy_pass http://payment_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 6. AI Chat Service (/api/chat) ───────────────
    location /api/chat {
        # limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # LLM calls can be slow – allow up to 120 s
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── 7. Statistical Service (/api/admin/statistics) ───────────────
    location /api/admin/statistics {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://statistical_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;

        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-User-Id' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_buffering off;
    }

    # ─── Frontend Web App ──────────────────────────────
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Error Pages ───────────────────────────────────
    error_page 502 503 504 @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"Service Unavailable","message":"Backend service is temporarily unavailable"}';
    }
}